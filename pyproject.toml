[project]
name = "controlled-islanding"
version = "0.1.0"
description = "Submodular energy-function approach to controlled islanding"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "networkx",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["islanding*", "examples*", "utils*"]